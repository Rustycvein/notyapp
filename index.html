<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotyApp - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <span class="icon">🔔</span>
                <div class="brand-text">
                    <h1>NotyApp</h1>
                    <p>Admin Dashboard</p>
                </div>
            </div>
            <nav>
                <button onclick="showSection('send')" id="btn-send" class="nav-item active"><i>✉</i> Send</button>
                <button onclick="showSection('stats')" id="btn-stats" class="nav-item"><i>📊</i> Statistics</button>
                <button onclick="showSection('logs')" id="btn-logs" class="nav-item"><i>📜</i> History</button>
            </nav>
            <div class="theme-switch-wrapper">
                <button id="themeToggle" class="btn-theme">
                    <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <section id="section-send" class="content-card">
                <h2>Send Notification</h2>
                <form id="notyForm" class="styled-form">
                    <div class="form-group">
                        <label>Channel</label>
                        <select id="type">
                            <option value="email">Email</option>
                            <option value="sms">SMS</option>
                            <option value="push">Push</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Language</label>
                        <select id="lang">
                            <option value="en">English (EN)</option>
                            <option value="es">Español (ES)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Template</label>
                        <select id="templateKey">
                            <option value="WELCOME">Welcome</option>
                            <option value="OTP">OTP</option>
                            <option value="ALERT">Alert</option>
                            <option value="MARKETING">Marketing</option>
                            <option value="RECEIPTS">Receipts</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Recipient Name</label>
                        <input type="text" id="userName" placeholder="Ej: Juan Pérez" required>
                    </div>
                    <div class="form-group">
                        <label>Amount (Optional)</label>
                        <input type="text" id="amount" placeholder="Ej: 500.00">
                    </div>
                    <div class="form-group">
                        <label>Recipient Destination</label>
                        <input type="text" id="to" placeholder="user@example.com / Token / +123456" required>
                    </div>
                    <button type="submit" id="sendBtn" class="btn-primary"><span>✈</span> Send Notification</button>
                </form>
            </section>

            <section id="section-stats" class="content-card hidden">
                <h2>System Analytics</h2>
                <div class="charts-grid">
                    <div class="chart-container">
                        <h4>Delivery Status</h4>
                        <canvas id="successChart"></canvas>
                    </div>
                    <div class="chart-container">
                        <h4>Channel Volume</h4>
                        <canvas id="channelChart"></canvas>
                    </div>
                </div>
            </section>

            <section id="section-logs" class="content-card hidden">
                <h2>Recent Activity</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>DATE</th>
                                <th>CHANNEL</th>
                                <th>TYPE</th>
                                <th>RECIPIENT</th>
                                <th>STATUS</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging-compat.js"></script>
    <script src="main.js"></script>
</body>
</html>
